<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body class="auth-body">
    <div class="auth-sheet text-center" style="max-width: 520px;">
        <i class="bi bi-exclamation-triangle-fill text-warning fs-1 mb-2 d-block"></i>
        <span class="badge bg-secondary mx-auto mb-3" th:text="'HTTP ' + ${status}">HTTP 404</span>
        <h3 class="auth-title" th:text="${titulo}">Registro não encontrado</h3>
        <p class="text-muted mx-auto" th:text="${mensagem}">O recurso solicitado não existe.</p>
        <a th:href="@{/dashboard}" class="btn btn-clyvo mt-3" style="width: auto;">
            <i class="bi bi-arrow-left me-1"></i> Voltar ao Dashboard
        </a>
    </div>
</body>
</html>
