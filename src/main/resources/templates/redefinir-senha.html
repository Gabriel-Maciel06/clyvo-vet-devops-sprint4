<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Redefinir Senha')}"></head>
<body class="auth-body">
    <div class="auth-sheet">
        <div class="auth-brand">
            <div class="auth-brand-mark"><i class="bi bi-shield-lock-fill" aria-hidden="true"></i></div>
            <div>
                <h3 class="auth-title">Redefinir Senha</h3>
            </div>
        </div>

        <div th:if="${tokenInvalido}" class="text-center">
            <div class="alert alert-danger small">
                <i class="bi bi-exclamation-triangle-fill me-1" aria-hidden="true"></i>
                Este link de redefinição é inválido, já foi usado ou expirou.
            </div>
            <a th:href="@{/recuperar-senha}" class="btn btn-clyvo mt-2">Solicitar novo link</a>
        </div>

        <form th:if="${!tokenInvalido}" th:action="@{/redefinir-senha}" th:object="${redefinirSenhaDto}" method="post">
            <input type="hidden" th:field="*{token}">

            <div class="mb-3">
                <label for="novaSenha" class="form-label">Nova senha</label>
                <input type="password" class="form-control" id="novaSenha" th:field="*{novaSenha}" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required autofocus>
                <div class="text-danger small" th:if="${#fields.hasErrors('novaSenha')}" th:errors="*{novaSenha}"></div>
            </div>
            <div class="mb-4">
                <label for="confirmarSenha" class="form-label">Confirmar nova senha</label>
                <input type="password" class="form-control" id="confirmarSenha" th:field="*{confirmarSenha}" placeholder="Repita a nova senha" autocomplete="new-password" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('confirmarSenha')}" th:errors="*{confirmarSenha}"></div>
            </div>
            <button type="submit" class="btn btn-clyvo">
                <i class="bi bi-check-circle-fill me-1"></i> Redefinir senha
            </button>
        </form>
    </div>
</body>
</html>
